name: Deploy to Railway

on:
  push:
    branches:
      - master
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: Railway environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: railway-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: quality
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'master' && 'production' || 'staging') }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - web
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 9328d2ff-8324-453b-99fa-d4a1634d6c33
      RAILWAY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'master' && 'production' || 'staging') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.26.1

      - name: Deploy ${{ matrix.service }} to ${{ env.RAILWAY_ENVIRONMENT }}
        run: >-
          railway up
          --ci
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT"
          --service "${{ matrix.service }}"
          --message "GitHub Actions ${GITHUB_SHA}"
